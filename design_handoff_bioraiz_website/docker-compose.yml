version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bioraiz
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: bioraiz_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioraiz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://bioraiz:dev_password@postgres:5432/bioraiz_dev
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/src:/app/api/src
    command: npm run dev -w api

volumes:
  postgres_data:
