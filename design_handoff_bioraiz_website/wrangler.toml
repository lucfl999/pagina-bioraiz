# Cloudflare Pages Configuration
[build]
command = "npm run build -w frontend"
publish = "frontend/dist"

[build.environment]
NODE_VERSION = "20.11.0"
NODE_ENV = "production"

[[redirects]]
from = "/api/*"
to = "https://api.bioraiz.net/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
